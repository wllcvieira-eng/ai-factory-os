<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Factory OS</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#15243b;background:#f2f5fa}aside{position:fixed;width:225px;height:100vh;background:#11233c;color:white;padding:25px 16px}aside h2{margin:0 0 8px;letter-spacing:-1px}aside small{color:#a5b9d5}nav{margin-top:30px;display:grid;gap:7px}nav button{background:transparent;color:#c9d7e9;border:0;text-align:left;padding:12px;font-size:14px;cursor:pointer;border-radius:8px}nav button.active,nav button:hover{background:#28486e;color:white}main{margin-left:225px;padding:32px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:30px;margin:0}h2{font-size:19px}p{color:#63748b}small{color:#687b94}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:white;border:1px solid #e1e7f0;border-radius:14px;padding:20px;box-shadow:0 3px 12px #142d4b06;margin-bottom:16px}.metric{font-size:27px;font-weight:750;margin:8px 0}.tag{font-size:11px;background:#e8eef8;color:#315e96;border-radius:20px;padding:5px 9px;display:inline-block}button.primary{background:#245d9c;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:600}button.secondary{background:white;border:1px solid #ccd7e5;color:#315575;border-radius:8px;padding:9px 12px;cursor:pointer}input,select,textarea{width:100%;border:1px solid #cfd8e5;border-radius:8px;padding:10px;font:inherit;background:white;color:#15243b}label{display:grid;gap:5px;font-size:13px;color:#53657e}form{display:grid;gap:12px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px 8px;border-bottom:1px solid #e5ebf3;font-size:13px}th{color:#62758c}.scroll{overflow:auto}.bar{background:#e6edf7;height:8px;border-radius:5px;overflow:hidden;margin:10px 0}.bar i{display:block;background:#3876bc;height:100%}.muted{color:#687b94;font-size:13px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.flex>*{flex:1}pre{white-space:pre-wrap;font:14px system-ui;background:#f2f5fa;padding:18px;border-radius:8px}.danger{color:#a33} @media(max-width:700px){aside{position:static;width:auto;height:auto;padding:16px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}main{margin:0;padding:16px}header{align-items:start}h1{font-size:23px}}
</style><aside><h2>AI / FACTORY</h2><small>Business operating system · V2</small><nav id="nav"></nav></aside><main><header><div><h1 id="title"></h1><p id="subtitle"></p></div><button class="secondary" onclick="backup()">Exportar backup</button></header><div id="app"></div></main><script>
const initial=[['Agent AI','Assistentes de atendimento',397,3970],['Digital Factory','Kits digitais',49,2940],['Market AI','Relatórios comerciais',149,1490],['Media AI','Canal de conteúdo',0,1550],['MicroLab','Aplicativos de nicho',49,1470],['Studio AI','Vídeos comerciais',297,2970],['Asset AI','Pacotes de artes',29,1740],['Radar AI','Newsletter',19.9,995],['Lead AI','Prospecção comercial',197,3940],['Career AI','Currículos e entrevistas',29.9,2990]];const key='aifactory-v1';const base={business:initial.map((x,i)=>({id:i,name:x[0],product:x[1],price:x[2],target:x[3],status:'Planejamento'})),entries:[],clients:[],tasks:initial.map((x,i)=>({id:i,business:i,name:'Validar oferta e público de '+x[0],done:false})),prompts:[],automations:[]};let s;try{s=JSON.parse(localStorage.getItem(key))||base}catch{s=base}const save=()=>localStorage.setItem(key,JSON.stringify(s));const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const biz=id=>s.business.find(b=>b.id==id)?.name||'—';const opts=()=>s.business.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');const month=()=>new Date().toISOString().slice(0,7);let selectedMonth=month(),page='Visão geral';const pages=['Visão geral','Negócios','Financeiro','Clientes','Tarefas','Gerador de produtos','Páginas comerciais','Central de prompts','Automações','Configurações'];const app=document.querySelector('#app');const formData=e=>Object.fromEntries(new FormData(e.target));const card=(t,v,sub)=>`<div class="card"><small>${t}</small><div class="metric">${v}</div><small>${sub||''}</small></div>`;function go(p){page=p;render()}function render(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('');document.querySelector('#title').textContent=page;document.querySelector('#subtitle').textContent='Central de operação dos negócios digitais';let rows=s.entries.filter(e=>e.date.startsWith(selectedMonth)),rev=rows.filter(e=>e.type==='Receita').reduce((a,e)=>a+e.value,0),cost=rows.filter(e=>e.type==='Despesa').reduce((a,e)=>a+e.value,0);let target=s.business.reduce((a,b)=>a+b.target,0);
if(page==='Visão geral'){app.innerHTML=`<div class="flex"><label>Mês de referência<input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label></div><br><div class="grid">${card('Receita',money(rev),'Lançamentos reais')}${card('Despesas',money(cost))}${card('Resultado',money(rev-cost))}${card('Meta mensal',money(target),'Meta comercial hipotética')}</div><div class="grid">${card('Negócios ativos',s.business.filter(b=>b.status==='Operando').length+' / 10')}${card('Clientes cadastrados',s.clients.length)}${card('Tarefas concluídas',s.tasks.filter(t=>t.done).length+' / '+s.tasks.length)}</div><div class="card"><h2>Desempenho por negócio</h2>${s.business.map(b=>{let r=rows.filter(e=>e.business==b.id&&e.type==='Receita').reduce((a,e)=>a+e.value,0);return `<div class="flex"><strong>${esc(b.name)}</strong><small>${money(r)} / ${money(b.target)}</small></div><div class="bar"><i style="width:${b.target?Math.min(100,r/b.target*100):0}%"></i></div>`}).join('')}</div>`}
if(page==='Negócios'){app.innerHTML=`<div class="grid">${s.business.map(b=>`<div class="card"><span class="tag">${esc(b.status)}</span><h2>${esc(b.name)}</h2><p>${esc(b.product)}</p><form onsubmit="editBiz(event,${b.id})"><label>Produto<input name="product" value="${esc(b.product)}"></label><label>Preço (R$)<input name="price" type="number" min="0" step=".01" value="${b.price}"></label><label>Meta mensal (R$)<input name="target" type="number" min="0" step=".01" value="${b.target}"></label><label>Status<select name="status">${['Planejamento','Validação','Desenvolvimento','Operando','Pausado'].map(x=>`<option ${x===b.status?'selected':''}>${x}</option>`).join('')}</select></label><button class="primary">Salvar</button></form></div>`).join('')}</div>`}
if(page==='Financeiro'){app.innerHTML=`<div class="grid">${card('Receitas',money(rev))}${card('Despesas',money(cost))}${card('Resultado',money(rev-cost))}</div><div class="card"><h2>Novo lançamento</h2><form onsubmit="add(event,'entries')"><div class="flex"><label>Negócio<select name="business">${opts()}</select></label><label>Tipo<select name="type"><option>Receita</option><option>Despesa</option></select></label><label>Data<input required type="date" name="date" value="${new Date().toISOString().slice(0,10)}"></label></div><label>Descrição<input required name="name"></label><label>Valor (R$)<input required type="number" min="0.01" step=".01" name="value"></label><button class="primary">Adicionar lançamento</button></form></div><div class="card scroll"><label>Mês<input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label><table><tr><th>Data</th><th>Negócio</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th></th></tr>${rows.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(biz(e.business))}</td><td>${esc(e.name)}</td><td>${e.type}</td><td>${money(e.value)}</td><td><button class="secondary danger" onclick="remove('entries','${e.id}')">Excluir</button></td></tr>`).join('')}</table></div>`}
if(page==='Clientes'){app.innerHTML=`<div class="card"><h2>Novo cliente / lead</h2><form onsubmit="add(event,'clients')"><label>Negócio<select name="business">${opts()}</select></label><label>Nome<input required name="name"></label><label>Contato<input name="contact"></label><label>Etapa<select name="status"><option>Lead</option><option>Proposta</option><option>Cliente</option><option>Inativo</option></select></label><button class="primary">Cadastrar</button></form></div><div class="card scroll"><table><tr><th>Nome</th><th>Negócio</th><th>Contato</th><th>Etapa</th><th></th></tr>${s.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(biz(c.business))}</td><td>${esc(c.contact)}</td><td><select onchange="updateClient('${c.id}',this.value)">${['Lead','Proposta','Cliente','Inativo'].map(x=>`<option ${x===c.status?'selected':''}>${x}</option>`).join('')}</select></td><td><button class="secondary" onclick="remove('clients','${c.id}')">Excluir</button></td></tr>`).join('')}</table></div>`}
if(page==='Tarefas'||page==='Automações'){let k=page==='Tarefas'?'tasks':'automations';app.innerHTML=`<div class="card"><h2>${page==='Tarefas'?'Nova tarefa':'Mapear automação'}</h2><form onsubmit="add(event,'${k}')"><label>Negócio<select name="business">${opts()}</select></label><label>Descrição<input name="name" required></label>${k==='automations'?'<label>Gatilho e ação<textarea name="detail" required></textarea></label>':''}<button class="primary">Adicionar</button></form></div><div class="card">${k==='automations'?'<p>Registro de planejamento. Nenhuma automação é executada automaticamente nesta versão.</p>':''}${s[k].map(t=>`<div class="flex" style="padding:12px 0;border-bottom:1px solid #e1e7ef"><input style="flex:0;width:20px" type="checkbox" ${t.done?'checked':''} onchange="toggle('${k}','${t.id}')"><div style="flex:5"><strong>${esc(t.name)}</strong><br><small>${esc(biz(t.business))} ${esc(t.detail||'')}</small></div><button class="secondary" onclick="remove('${k}','${t.id}')">Excluir</button></div>`).join('')}</div>`}
if(page==='Gerador de produtos'||page==='Páginas comerciais'){app.innerHTML=`<div class="card"><h2>${page}</h2><p>Gere um briefing local ou utilize a IA conectada ao servidor para criar conteúdo comercial. Revise o resultado antes de publicar.</p><form onsubmit="generate(event)"><label>Negócio<select name="business">${opts()}</select></label><label>Produto ou tema<input name="name" required></label><label>Público-alvo<input name="audience" required></label><label>Benefício / problema<textarea required name="benefit"></textarea></label><button class="primary">Preparar briefing</button></form><div id="output"></div></div>`}
if(page==='Central de prompts'){app.innerHTML=`<div class="card"><h2>Novo prompt</h2><form onsubmit="add(event,'prompts')"><label>Título<input required name="name"></label><label>Prompt<textarea rows="5" required name="detail"></textarea></label><button class="primary">Salvar prompt</button></form></div>${s.prompts.map(p=>`<div class="card"><h2>${esc(p.name)}</h2><pre>${esc(p.detail)}</pre><button class="secondary" onclick="copyPrompt('${p.id}')">Copiar</button> <button class="secondary" onclick="remove('prompts','${p.id}')">Excluir</button></div>`).join('')}`}
if(page==='Configurações'){app.innerHTML=`<div class="card"><h2>Dados e segurança</h2><p>Os dados ficam no armazenamento local deste navegador. A versão online usa acesso privado por senha no servidor. Não há sincronização ou pagamentos. A integração de IA depende da configuração do servidor. Não use para armazenar dados sensíveis de clientes. Exporte backups regularmente.</p><button class="primary" onclick="backup()">Exportar JSON</button><br><br><label>Importar backup JSON<input type="file" accept=".json" onchange="restore(this)"></label></div>`}}
function editBiz(e,id){e.preventDefault();let f=formData(e),b=s.business.find(b=>b.id===id);Object.assign(b,f,{price:Number(f.price),target:Number(f.target)});save();render()}function add(e,k){e.preventDefault();let f=formData(e);if(k==='entries')f.value=Number(f.value);s[k].push({...f,id:Date.now().toString(),done:false});save();render()}function remove(k,id){if(confirm('Excluir este registro?')){s[k]=s[k].filter(x=>String(x.id)!==String(id));save();render()}}function toggle(k,id){let t=s[k].find(x=>String(x.id)===String(id));t.done=!t.done;save();render()}function updateClient(id,status){s.clients.find(c=>c.id===id).status=status;save();render()}let draft='';let generated='';function generate(e){e.preventDefault();let f=formData(e);draft=`Atue como especialista em ${page==='Gerador de produtos'?'desenvolvimento de produtos digitais':'copywriting de páginas de vendas'}.\nNegócio: ${biz(f.business)}\nProduto: ${f.name}\nPúblico-alvo: ${f.audience}\nBenefício: ${f.benefit}\n\n${page==='Gerador de produtos'?'Crie proposta de valor, estrutura completa do produto mínimo, conteúdo, formato de entrega, preço sugerido com premissas e plano de validação.':'Crie título, subtítulo, benefícios, seção de oferta, objeções, FAQ e chamada para ação. Não invente depoimentos, resultados ou garantias.'}\nUse português brasileiro e sinalize hipóteses que precisam ser validadas.`;document.querySelector('#output').innerHTML=`<pre>${esc(draft)}</pre><button class="secondary" onclick="copyText(draft)">Copiar briefing</button> <button class="primary" onclick="saveDraft()">Salvar na central</button> <button class="primary" onclick="runAI(this)">Gerar com IA</button><div id="airesult" aria-live="polite"></div>`;generated='';}async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Copiado!')}catch{prompt('Copie o texto:',t)}}function copyPrompt(id){copyText(s.prompts.find(p=>p.id===id).detail)}function saveDraft(){s.prompts.push({id:Date.now().toString(),name:'Briefing — '+page,detail:draft});save();alert('Briefing salvo.')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='ai-factory-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(input){try{let x=JSON.parse(await input.files[0].text());if(!['business','entries','clients','tasks','prompts','automations'].every(k=>Array.isArray(x[k]))||x.business.length!==10||!x.business.every(b=>typeof b.name==='string'&&typeof b.target==='number'&&typeof b.price==='number')||!x.entries.every(e=>typeof e.date==='string'&&typeof e.value==='number'))throw Error();if(confirm('Substituir os dados locais pelo backup?')){s=x;save();render()}}catch{alert('Backup inválido.')}}async function runAI(btn){const target=document.querySelector('#airesult'); if(!target)return;btn.disabled=true;target.textContent='Gerando conteúdo...';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:draft})});let data;try{data=await r.json()}catch{throw Error('Abra a plataforma pelo servidor configurado, não diretamente pelo arquivo HTML.')}if(!r.ok)throw Error(data.error||'Falha na geração');generated=data.text;target.replaceChildren();const pre=document.createElement('pre');pre.textContent=generated;target.append(pre);for(const [label,fn] of [['Copiar conteúdo',()=>copyText(generated)],['Salvar conteúdo',()=>{s.prompts.push({id:Date.now().toString(),name:'Conteúdo IA — '+page,detail:generated});save();alert('Conteúdo salvo.')}],['Baixar texto',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([generated],{type:'text/plain;charset=utf-8'}));a.download='conteudo-ai-factory.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}]]){const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=fn;target.append(b)}}catch(e){target.textContent=e.message}finally{btn.disabled=false}}
render();
</script></html>
